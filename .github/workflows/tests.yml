name: Tests
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-Check aller Script-Blöcke
        run: node tests/synchk.js
      - name: Kernlogik-Tests (echte Funktionen aus der HTML)
        run: node tests/logic.test.js
